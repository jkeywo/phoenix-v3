name: Build, verify and deploy
on:
  push:
    branches: [main]
  pull_request:
    paths:
      [
        "CMakeLists.txt",
        "cmake/**",
        "include/**",
        "src/**",
        "tests/**",
        "scripts/**",
        "web/**",
        "content/**",
        "service/**",
        ".github/workflows/**",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  foundation:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap pinned local tools
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Build, verify and run native/WASM synthetic system integration
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Stage public browser files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $site = New-Item -ItemType Directory -Path build/pages
          Copy-Item -LiteralPath build/web/index.html -Destination $site
          Copy-Item -LiteralPath build/web/menu.css,build/web/launcher.mjs -Destination $site
          New-Item -ItemType Directory -Path build/pages/assets | Out-Null
          Copy-Item -LiteralPath build/web/assets/menu -Destination build/pages/assets -Recurse
          Copy-Item -LiteralPath build/web/assets/audio -Destination build/pages/assets -Recurse
          Copy-Item -LiteralPath build/web/assets/LatoLatin-Regular.ttf,build/web/assets/FONT-LICENSE.txt,build/web/assets/UnifrakturCook-Bold.ttf,build/web/assets/UnifrakturCook-OFL.txt,build/web/assets/locales.json -Destination build/pages/assets
          foreach ($role in @('server', 'client', 'workshop'))
          {
            foreach ($extension in @('js', 'wasm', 'data'))
            {
              Copy-Item -LiteralPath "build/web/$role.$extension" -Destination $site
            }
          }
          Copy-Item -LiteralPath build/web/phoenix_workshop_test.js,build/web/phoenix_workshop_test.wasm,build/web/workshop-test-worker.js -Destination $site
          Copy-Item -LiteralPath build/native/training.zip -Destination $site
          Copy-Item -LiteralPath build/native/training.zip.menu.json -Destination $site
          Copy-Item -LiteralPath build/native/base.zip,build/native/base.zip.menu.json -Destination $site
          Set-Content -LiteralPath build/pages/revision.txt -Value $env:GITHUB_SHA
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
