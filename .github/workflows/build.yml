name: Build and verify
on:
  push:
    branches: [main]
    paths:
      [
        "CMakeLists.txt",
        "cmake/**",
        "include/**",
        "src/**",
        "tests/**",
        "scripts/**",
        "web/**",
        "content/**",
        "service/**",
        ".github/workflows/**",
      ]
  pull_request:
    paths:
      [
        "CMakeLists.txt",
        "cmake/**",
        "include/**",
        "src/**",
        "tests/**",
        "scripts/**",
        "web/**",
        "content/**",
        "service/**",
        ".github/workflows/**",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap pinned local tools
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Build, verify and run synthetic system integration
        shell: pwsh
        run: ./scripts/check.ps1
