name: Build, verify and deploy
on:
  push:
    branches: [main]
  pull_request:
    paths:
      [
        "CMakeLists.txt",
        "cmake/**",
        "include/**",
        "src/**",
        "tests/**",
        "scripts/**",
        "web/**",
        "content/**",
        "service/**",
        ".github/workflows/**",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packs:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap pinned local tools
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Build the packager and verify browser pack inputs
        shell: pwsh
        run: |
          & ./.tools/emsdk/node/24.19.0_64bit/node.exe --test tests/system/deployment_verifier.mjs
          if ($LASTEXITCODE) { throw 'Deployment verification integration failed' }
          ./scripts/build.ps1 -Target native -BuildTarget base_pack,test_missions_pack
      - name: Upload verified browser pack inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-pack-inputs
          if-no-files-found: error
          path: |
            build/native/base.zip
            build/native/base.zip.menu.json
            build/native/base.zip.clients/
            build/native/test-missions.zip
            build/native/test-missions.zip.menu.json
            build/native/test-missions.zip.clients/
  web-build:
    needs: packs
    runs-on: ubuntu-24.04
    # Each cold Release variant gets its own runner and the existing time budget.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [ordinary, threaded]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap pinned local tools
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Download this run's verified pack inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-pack-inputs
          path: build/native
      - name: Build and run WASM integration; record continuations
        shell: pwsh
        run: ./scripts/check.ps1 -Target web -Jobs 2 -Threaded:('${{ matrix.variant }}' -eq 'threaded') -ContinuationOutputDirectory build/web-continuations/${{ matrix.variant }}
      - name: Retain verified browser runtimes
        shell: pwsh
        run: |
          $runtime = New-Item -ItemType Directory -Path build/web-runtime -Force
          Copy-Item -LiteralPath build/web/index.html,build/web/menu.css,build/web/launcher.mjs,build/web/base-verifier.mjs,build/web/base-verifier-worker.js,build/web/session-pump.mjs,build/web/session-clock.js,build/web/session-profile.mjs,build/web/runtime-environment.mjs,build/web/isolation-worker.js -Destination $runtime
          Copy-Item -LiteralPath build/web/assets -Destination $runtime -Recurse
          foreach ($role in @('server', 'client', 'workshop')) {
            foreach ($extension in @('js', 'wasm', 'data')) {
              Copy-Item -LiteralPath "build/web/$role.$extension" -Destination $runtime
            }
          }
          Copy-Item -LiteralPath build/web/phoenix_workshop_test.js,build/web/phoenix_workshop_test.wasm,build/web/workshop-test-worker.js -Destination $runtime
      - name: Upload verified browser runtimes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-runtime-${{ matrix.variant }}
          if-no-files-found: error
          path: build/web-runtime/
      - name: Upload WASM continuation set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-continuations-${{ matrix.variant }}
          if-no-files-found: error
          path: build/web-continuations/${{ matrix.variant }}/
  web:
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Download this run's verified pack inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-pack-inputs
          path: build/native
      - name: Download verified ordinary browser runtimes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-runtime-ordinary
          path: build/web-fallback
      - name: Download verified worker browser runtimes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-runtime-threaded
          path: build/web
      - name: Stage public browser files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path (Get-Location) 'build/pages'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          $site = New-Item -ItemType Directory -Path $stage
          Copy-Item -LiteralPath build/web/index.html -Destination $site
          Copy-Item -LiteralPath build/web/menu.css,build/web/launcher.mjs,build/web/base-verifier.mjs,build/web/base-verifier-worker.js,build/web/session-pump.mjs,build/web/session-clock.js,build/web/session-profile.mjs,build/web/runtime-environment.mjs,build/web/isolation-worker.js -Destination $site
          New-Item -ItemType Directory -Path build/pages/assets | Out-Null
          Copy-Item -LiteralPath build/web/assets/menu -Destination build/pages/assets -Recurse
          Copy-Item -LiteralPath build/web/assets/audio -Destination build/pages/assets -Recurse
          Copy-Item -LiteralPath build/web/assets/LatoLatin-Regular.ttf,build/web/assets/FONT-LICENSE.txt,build/web/assets/UnifrakturCook-Bold.ttf,build/web/assets/UnifrakturCook-OFL.txt,build/web/assets/ComicNeue-Regular.ttf,build/web/assets/ComicNeue-OFL.txt,build/web/assets/locales.json -Destination build/pages/assets
          $threaded = New-Item -ItemType Directory -Path build/pages/threaded
          foreach ($role in @('server', 'client', 'workshop'))
          {
            foreach ($extension in @('js', 'wasm', 'data'))
            {
              Copy-Item -LiteralPath "build/web-fallback/$role.$extension" -Destination $site
              Copy-Item -LiteralPath "build/web/$role.$extension" -Destination $threaded
            }
          }
          Copy-Item -LiteralPath build/web-fallback/phoenix_workshop_test.js,build/web-fallback/phoenix_workshop_test.wasm,build/web-fallback/workshop-test-worker.js -Destination $site
          Set-Content -LiteralPath build/pages/runtime-capabilities.json -Value '{"root_threaded":false,"threaded_directory":true}'
          Copy-Item -LiteralPath build/native/base.zip,build/native/base.zip.menu.json,build/native/base.zip.clients,build/native/test-missions.zip,build/native/test-missions.zip.menu.json,build/native/test-missions.zip.clients -Destination $site -Recurse
          Set-Content -LiteralPath build/pages/revision.txt -Value $env:GITHUB_SHA
          node scripts/verify-deployment.mjs build/pages
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/pages
  native:
    needs: web
    runs-on: windows-2022
    # Hosted MSVC module builds have exhausted 45 minutes before reaching CTest.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap pinned local tools
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Build, verify and run native and network system integration
        shell: pwsh
        run: ./scripts/check.ps1 -Target native
      - name: Verify development-only test bases
        shell: pwsh
        run: ./scripts/build.ps1 -Target native -BuildTarget development_packs
      - name: Upload development test bases separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-test-bases
          if-no-files-found: error
          path: |
            build/native/test.zip
            build/native/test.zip.menu.json
            build/native/test-3d.zip
            build/native/test-3d.zip.menu.json
      - name: Upload verified packs and native continuation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-verification
          if-no-files-found: error
          path: |
            build/native/base.zip
            build/native/base.zip.menu.json
            build/native/base.zip.clients/
            build/native/test-missions.zip
            build/native/test-missions.zip.menu.json
            build/native/test-missions.zip.clients/
            build/native/continuation.trace
            build/native/*-continuation.trace
  linux:
    needs: web
    runs-on: ubuntu-24.04
    # Allow the full trace/network gate after the cold module build and CTest.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Install Linux development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build python3-pip pkg-config openssl \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libasound2-dev libudev-dev libdbus-1-dev libgtk-3-dev libcurl4-openssl-dev
      - name: Bootstrap pinned build tools and native Clang
        shell: pwsh
        run: |
          ./scripts/bootstrap.ps1
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$PWD/.tools/python/cmake/data/bin"
      - name: Build game and packager; run native and network integration
        env:
          # World module consumers can each use several GiB while Clang compiles them.
          JOBS: "2"
        run: ./scripts/check-linux.sh
  continuation:
    needs: [web, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Download native continuations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-verification
          path: build/native
      - name: Download ordinary WASM continuations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-continuations-ordinary
          path: build/web-continuations/ordinary
      - name: Download worker WASM continuations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-continuations-threaded
          path: build/web-continuations/threaded
      - name: Compare native, ordinary WASM and worker WASM continuations
        run: node scripts/wasm-continuations.mjs compare build/native build/web-continuations/ordinary build/web-continuations/threaded
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [web, native, linux, continuation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
