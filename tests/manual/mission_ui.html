<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Manual mission debrief smoke</title>
	</head>
	<body>
		<div id="semantics" aria-label="Player console" style="position: absolute; opacity: 0; pointer-events: none">
			<p id="player-status" role="status" aria-live="polite"></p>
		</div>
		<canvas id="canvas" width="2560" height="1080" style="width: 2560px; height: 1080px"></canvas>
		<pre id="result">Running manual mission debrief smoke…</pre>
		<script>
			var Module = {
				arguments: ["/assets", new URLSearchParams(location.search).get("mode") || "delivery-courier"],
				preRun: [
					function () {
						const checkpoint = new URLSearchParams(location.search).get("checkpoint");
						if (!checkpoint || !/^[a-zA-Z0-9._-]+\.zip$/.test(checkpoint)) return;
						Module.arguments.push("/checkpoint.zip");
						addRunDependency("mission-checkpoint");
						fetch(checkpoint)
							.then((response) => {
								if (!response.ok) throw new Error("Checkpoint could not be loaded");
								return response.arrayBuffer();
							})
							.then((data) => FS.writeFile("/checkpoint.zip", new Uint8Array(data)))
							.catch((error) => {
								Module.printErr("FAIL " + error.message);
							})
							.finally(() => removeRunDependency("mission-checkpoint"));
					},
				],
				canvas: document.getElementById("canvas"),
				onAbort(reason) {
					document.getElementById("result").textContent = "FAIL Browser runtime: " + reason;
				},
				print(text) {
					console.log(text);
					if (text.startsWith("WAIT ") || text.startsWith("PROGRESS ")) {
						document.getElementById("result").textContent = text;
					}
					if (text.startsWith("PASS ")) {
						document.getElementById("result").textContent = text;
						if (Module.missionCheckpoint) {
							const save = document.createElement("a");
							save.href = Module.missionCheckpoint;
							save.download = "rescue-report.zip";
							save.textContent = "Download fresh mission save";
							document.body.append(save);
						}
						for (const [name, data] of Object.entries(Module.missionCaptures || {})) {
							const heading = document.createElement("h2");
							heading.textContent = name;
							const image = document.createElement("img");
							image.src = data;
							image.alt = name;
							image.style.maxWidth = "100%";
							document.body.append(heading, image);
						}
					}
				},
				printErr(text) {
					console.error(text);
					if (text.startsWith("FAIL ")) {
						document.getElementById("result").textContent = text;
					}
				},
			};
		</script>
		{{{ SCRIPT }}}
	</body>
</html>
