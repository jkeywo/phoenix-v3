<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Manual sensor smoke</title>
	</head>
	<body>
		<div id="semantics" aria-label="Player console" style="position: absolute; opacity: 0; pointer-events: none">
			<p id="player-status" role="status" aria-live="polite"></p>
		</div>
		<canvas id="canvas" width="1280" height="900"></canvas>
		<pre id="result">Running manual sensor smoke…</pre>
		<script>
			var Module = {
				arguments: new URLSearchParams(location.search).has("portrait") ? ["/assets", "portrait"] : ["/assets"],
				canvas: document.getElementById("canvas"),
				print(text) {
					console.log(text);
					if (text.startsWith("PASS ")) {
						document.getElementById("result").textContent = text;
						for (const [name, data] of Object.entries(Module.sensorCaptures || {})) {
							const heading = document.createElement("h2");
							heading.textContent = name;
							const image = document.createElement("img");
							image.src = data;
							image.alt = name;
							image.style.maxWidth = "100%";
							document.body.append(heading, image);
						}
					}
				},
				printErr(text) {
					console.error(text);
					if (text.startsWith("FAIL ")) {
						document.getElementById("result").textContent = text;
					}
				},
			};
		</script>
		{{{ SCRIPT }}}
	</body>
</html>
