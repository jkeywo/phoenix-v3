<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Against the Stars</title>
		<script>
			if (new URLSearchParams(location.search).has("type") || new URLSearchParams(location.search).has("role"))
				document.documentElement.classList.add("direct-launch");
		</script>
		<link rel="stylesheet" href="menu.css" />
	</head>
	<body>
		<main id="menu" aria-labelledby="title">
			<div id="menu-space" aria-hidden="true">
				<div class="space-track"><i></i><i></i><i></i><i></i></div>
			</div>
			<div id="menu-debris" aria-hidden="true">
				<div class="space-track debris-track"><i></i><i></i><i></i><i></i></div>
			</div>
			<div id="menu-frame" aria-hidden="true"></div>
			<div id="menu-scutter" aria-hidden="true" hidden></div>
			<h1 id="title">Against the Stars</h1>
			<button type="button" id="profile-crt" class="menu-crt" aria-label="Edit profile">
				<div class="crt-screen">
					<img id="profile-avatar" class="crt-avatar" alt="Player avatar" hidden />
					<span id="profile-initial" class="crt-avatar" aria-hidden="true">?</span>
					<span id="profile-name" class="crt-name">&lt;username&gt;</span>
				</div>
			</button>
			<button id="settings" class="corner top" type="button" aria-label="Settings" title="Settings">
				<img src="assets/menu/settings.png" alt="" loading="lazy" /><span>Settings</span>
			</button>
			<div id="viewport"><div id="columns" class="columns"></div></div>
			<button id="packs" class="skin corner bottom" type="button">Mod Packs</button>
			<button id="back" class="skin corner back" type="button" hidden>Back</button>
		</main>
		<p id="status" role="status" aria-live="polite">Loading menu…</p>
		<dialog id="popup" aria-labelledby="popup-title"></dialog>
		<section id="runtime" hidden aria-label="Phoenix application">
			<div id="semantics" aria-label="Player console">
				<p id="player-status" role="status" aria-live="polite"></p>
			</div>
			<canvas id="canvas" tabindex="0" aria-label="Phoenix game graphics"></canvas>
		</section>
		<noscript>This game requires JavaScript and WebAssembly.</noscript>
		<script type="module" src="launcher.mjs"></script>
	</body>
</html>
